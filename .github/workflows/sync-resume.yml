name: Sync Resume from CDN

on:
  schedule:
    # Run once a week on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest resume from CDN
        run: |
          mkdir -p public
          curl -sL -A "Mozilla/5.0" \
            -o public/resume.pdf \
            "https://cdn-public-document.mohitur.com/resume/Mohd_Mohitur_Rahaman_Resume.pdf"

      - name: Validate downloaded PDF
        run: |
          if [ ! -s public/resume.pdf ]; then
            echo "Error: Downloaded file is empty!"
            exit 1
          fi
          HEADER=$(head -c 5 public/resume.pdf)
          if [ "$HEADER" != "%PDF-" ]; then
            echo "Error: Downloaded file is not a valid PDF! Received header: $HEADER"
            exit 1
          fi
          echo "PDF validation successful: $(ls -lh public/resume.pdf)"

      - name: Commit and push if changed
        run: |
          if git diff --quiet public/resume.pdf; then
            echo "Resume is already up to date. No changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/resume.pdf
            git commit -m "chore(resume): sync latest resume from CDN [skip ci]"
            git push
            echo "Latest resume committed and pushed successfully!"
          fi
